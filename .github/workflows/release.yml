name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      linux-artifacts: calc_cli_linux,calc_sdl_linux,calc_cli_windows_cross
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential mingw-w64 libsdl2-dev libsdl2-ttf-dev
      - name: Build Linux binaries
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target calc_cli CalcCppSDL -- -j 2
      - name: Cross-compile Windows CLI (mingw)
        run: |
          cmake -S . -B build-windows -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF
          cmake --build build-windows --target calc_cli -- -j 2
      - name: Upload artifacts (linux calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_linux
          path: build/calc_cli
      - name: Upload artifacts (linux SDL GUI)
        uses: actions/upload-artifact@v4
        with:
          name: calc_sdl_linux
          path: build/CalcCppSDL
      - name: Upload artifacts (windows cli - cross)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_cross
          path: build-windows/calc_cli.exe

  build-windows-native:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build (MSVC)
        run: |
          cmake --build build --config Release --target calc_cli CalcCpp --parallel 2
      - name: Upload artifacts (windows calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_native
          path: build/Release/calc_cli.exe
      - name: Upload artifacts (windows CalcCpp GUI)
        uses: actions/upload-artifact@v4
        with:
          name: CalcCpp_windows
          path: build/Release/CalcCpp.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-native]
    steps:
      - uses: actions/checkout@v4
      - name: Download linux calc_cli
        uses: actions/download-artifact@v3
        with:
          name: calc_cli_linux
      - name: Download linux SDL GUI
        uses: actions/download-artifact@v3
        with:
          name: calc_sdl_linux
      - name: Download windows cli (cross)
        uses: actions/download-artifact@v3
        with:
          name: calc_cli_windows_cross
      - name: Download windows native artifacts
        uses: actions/download-artifact@v3
        with:
          name: calc_cli_windows_native
      - name: Download windows GUI artifact
        uses: actions/download-artifact@v3
        with:
          name: CalcCpp_windows
      - name: List downloaded artifacts
        run: ls -R
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets - linux calc_cli
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: calc_cli_linux
          asset_name: calc_cli-linux
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets - linux SDL GUI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: calc_sdl_linux
          asset_name: CalcCppSDL-linux
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets - windows cli (cross)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: calc_cli_windows_cross
          asset_name: calc_cli-windows-cross.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets - windows cli (native)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: calc_cli_windows_native
          asset_name: calc_cli-windows.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets - windows GUI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: CalcCpp_windows
          asset_name: CalcCpp-windows.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
