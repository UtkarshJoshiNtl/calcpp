name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      linux-artifacts: calc_cli_linux,calc_sdl_linux,calc_cli_windows_cross
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential mingw-w64 libsdl2-dev libsdl2-ttf-dev
      - name: Build Linux binaries
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target calc_cli CalcCppSDL -- -j 2
      - name: Cross-compile Windows CLI (mingw)
        run: |
          cmake -S . -B build-windows -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF
          cmake --build build-windows --target calc_cli -- -j 2
      - name: Upload artifacts (linux calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_linux
          path: build/calc_cli
      - name: Upload artifacts (linux SDL GUI)
        uses: actions/upload-artifact@v4
        with:
          name: calc_sdl_linux
          path: build/CalcCppSDL
      - name: Upload artifacts (windows cli - cross)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_cross
          path: build-windows/calc_cli.exe

  build-windows-native:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build (MSVC)
        run: |
          cmake --build build --config Release --target calc_cli CalcCpp --parallel 2
      - name: Upload artifacts (windows calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_native
          path: build/Release/calc_cli.exe
      - name: Upload artifacts (windows CalcCpp GUI)
        uses: actions/upload-artifact@v4
        with:
          name: CalcCpp_windows
          path: build/Release/CalcCpp.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-native]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare release files
        run: |
          cp dist/calc_cli_linux/calc_cli dist/calc_cli-linux
          cp dist/calc_sdl_linux/CalcCppSDL dist/CalcCppSDL-linux
          cp dist/calc_cli_windows_cross/calc_cli.exe dist/calc_cli-windows-cross.exe
          cp dist/calc_cli_windows_native/calc_cli.exe dist/calc_cli-windows.exe
          cp dist/CalcCpp_windows/CalcCpp.exe dist/CalcCpp-windows.exe
          ls -lah dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/calc_cli-linux
            dist/CalcCppSDL-linux
            dist/calc_cli-windows-cross.exe
            dist/calc_cli-windows.exe
            dist/CalcCpp-windows.exe
