name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      linux-artifacts: calc_cli_linux,calc_sdl_linux,calc_cli_windows_cross
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential mingw-w64 libsdl2-dev libsdl2-ttf-dev
      - name: Build Linux binaries
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target calc_cli CalcCppSDL -- -j 2
      - name: Cross-compile Windows CLI (mingw)
        run: |
          cmake -S . -B build-windows -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF
          cmake --build build-windows --target calc_cli -- -j 2
      - name: Upload artifacts (linux calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_linux
          path: build/calc_cli
      - name: Upload artifacts (linux SDL GUI)
        uses: actions/upload-artifact@v4
        with:
          name: calc_sdl_linux
          path: build/CalcCppSDL
      - name: Upload artifacts (windows cli - cross)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_cross
          path: build-windows/calc_cli.exe

  build-windows-native:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: |
          cmake -S . -B build -DBUILD_CLI=ON -DBUILD_SDL_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build (MSVC)
        run: |
          cmake --build build --config Release --target calc_cli CalcCpp --parallel 2
      - name: Upload artifacts (windows calc_cli)
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli_windows_native
          path: build/Release/calc_cli.exe
      - name: Upload artifacts (windows CalcCpp GUI)
        uses: actions/upload-artifact@v4
        with:
          name: CalcCpp_windows
          path: build/Release/CalcCpp.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-native]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Install zip (for packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
      - name: Prepare release archives
        run: |
          mkdir -p dist_out
          # package linux CLI
          if [ -f dist/calc_cli_linux/calc_cli ]; then
            tar -czf dist_out/calc_cli-linux.tar.gz -C dist/calc_cli_linux calc_cli
          fi
          # package linux SDL GUI
          if [ -f dist/calc_sdl_linux/CalcCppSDL ]; then
            tar -czf dist_out/CalcCppSDL-linux.tar.gz -C dist/calc_sdl_linux CalcCppSDL
          fi
          # package windows cross-compiled CLI
          if [ -f dist/calc_cli_windows_cross/calc_cli.exe ]; then
            zip -j dist_out/calc_cli-windows-cross.zip dist/calc_cli_windows_cross/calc_cli.exe
          fi
          # package windows native CLI
          if [ -f dist/calc_cli_windows_native/calc_cli.exe ]; then
            zip -j dist_out/calc_cli-windows-native.zip dist/calc_cli_windows_native/calc_cli.exe
          fi
          # package windows GUI
          if [ -f dist/CalcCpp_windows/CalcCpp.exe ]; then
            zip -j dist_out/CalcCpp-windows.zip dist/CalcCpp_windows/CalcCpp.exe
          fi
          ls -lah dist || true
          ls -lah dist_out || true
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset - linux CLI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist_out/calc_cli-linux.tar.gz
          asset_name: calc_cli-linux.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset - linux SDL GUI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist_out/CalcCppSDL-linux.tar.gz
          asset_name: CalcCppSDL-linux.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset - windows CLI (cross)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist_out/calc_cli-windows-cross.zip
          asset_name: calc_cli-windows-cross.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset - windows CLI (native)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist_out/calc_cli-windows-native.zip
          asset_name: calc_cli-windows-native.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset - windows GUI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist_out/CalcCpp-windows.zip
          asset_name: CalcCpp-windows.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
